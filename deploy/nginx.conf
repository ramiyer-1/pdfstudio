# PDF Studio: nginx site config for a VPS.
# 1. Copy the app:   sudo mkdir -p /var/www/pdf-studio && sudo cp -r index.html styles.css app.js editor.js vendor /var/www/pdf-studio/
# 2. Install this:   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pdf-studio
#                    sudo ln -s /etc/nginx/sites-available/pdf-studio /etc/nginx/sites-enabled/
# 3. Set server_name below, then: sudo nginx -t && sudo systemctl reload nginx
# 4. HTTPS (recommended): sudo certbot --nginx -d pdf.example.com

server {
    listen 80;
    listen [::]:80;
    server_name pdf.example.com;            # <- your domain (or the VPS IP)

    root /var/www/pdf-studio;
    index index.html;

    # Everything runs in the browser; the server only serves static files.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    # App files: always revalidate so updates show up immediately.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Third-party libraries never change between releases: cache for 30 days.
    location /vendor/ {
        expires 30d;
    }
}
